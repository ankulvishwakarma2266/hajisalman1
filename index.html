<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu&display=swap');

#hsm-page, #hsm-page * {
  box-sizing: border-box;
}

#hsm-page {
  margin: 0;
  padding: 0 0 120px;
  background: #080d20;
  color: #f5f5ff;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

#hsm-page .hero {
  background: linear-gradient(145deg,#211c50 0%,#11132f 60%,#090d20 100%);
  text-align: center;
  padding: 55px 25px 75px;
}

#hsm-page .topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  text-align: left;
  max-width: 1000px;
  margin: auto;
  padding-bottom: 90px;
}

#hsm-page .brand {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 2px;
  white-space: nowrap;
}

#hsm-page .brand span {
  color: #00d9ef;
}

#hsm-page .tagline {
  border: 1px solid #7554aa;
  border-radius: 40px;
  padding: 16px 22px;
  color: #d8c9f5;
  font-size: 16px;
  letter-spacing: 2px;
  white-space: nowrap;
}

#hsm-page .profile {
  width: 320px;
  height: 320px;
  padding: 10px;
  margin: 0 auto 45px;
  border-radius: 50%;
  background: linear-gradient(135deg,#00e5de,#258cff,#d52bff,#ffb04b);
  box-shadow: 0 0 40px #7037c755;
}

#hsm-page .profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 6px solid #11152e;
}

#hsm-page .welcome {
  color: #00dbea;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 5px;
  margin-bottom: 22px;
}

#hsm-page h1 {
  font-size: clamp(40px,7vw,68px);
  line-height: 1.3;
  margin: 18px 0 35px;
  font-weight: 800;
}

#hsm-page h1 span {
  background: linear-gradient(90deg,#e5b5ff,#16dafa);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

#hsm-page .urdu {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: 34px;
  line-height: 2.3;
  direction: rtl;
  color: #e9dcff;
  margin: 25px auto;
  max-width: 900px;
}

#hsm-page .intro {
  color: #c2c9dc;
  font-size: 24px;
  line-height: 2;
  max-width: 950px;
  margin: 35px auto 50px;
}

#hsm-page .telegram {
  display: block;
  max-width: 650px;
  width: 100%;
  margin: 30px auto;
  padding: 30px 22px;
  border-radius: 30px;
  text-decoration: none;
  text-align: center;
  color: white;
  font-size: 28px;
  font-weight: 800;
  line-height: 1.6;
  background: linear-gradient(105deg,#9b28ed,#713ce9,#008fdf);
  box-shadow: 0 10px 35px #6338db55;
  transition: .2s;
}

#hsm-page .telegram:hover {
  transform: translateY(-4px);
}

#hsm-page .telegram small {
  display: block;
  font-size: 19px;
  font-weight: 500;
}

#hsm-page .telegram .plane {
  margin-right: 12px;
}

#hsm-page .section {
  max-width: 1000px;
  padding: 75px 35px;
  margin: auto;
  text-align: center;
}

#hsm-page .section h2 {
  font-size: 48px;
  margin: 0 0 25px;
  font-weight: 800;
}

#hsm-page .section-subtitle {
  color: #c0c8dc;
  font-size: 25px;
  line-height: 2;
  margin-bottom: 55px;
}

#hsm-page .learning-card {
  background: linear-gradient(120deg,#17223d,#111a31);
  border: 1px solid #34415f;
  border-radius: 35px;
  padding: 40px;
  text-align: left;
  margin: 35px 0;
  box-shadow: 0 10px 30px #00000030;
}

#hsm-page .learning-card .emoji {
  font-size: 55px;
  margin-bottom: 20px;
}

#hsm-page .learning-card h3 {
  font-size: 32px;
  margin: 0 0 20px;
  font-weight: 700;
}

#hsm-page .learning-card p {
  color: #bdc7dc;
  font-size: 24px;
  line-height: 2;
  margin: 0;
}

#hsm-page .quote {
  margin: 35px auto 75px;
  padding: 45px 30px;
  border-radius: 40px;
  border: 1px solid #55447e;
  background: linear-gradient(120deg,#24204d,#102e43);
  font-size: 30px;
  line-height: 2;
  color: #f0e7ff;
}

#hsm-page .community {
  padding: 45px 30px 85px;
  text-align: center;
  max-width: 1000px;
  margin: auto;
}

#hsm-page .community h2 {
  font-size: 48px;
  margin-bottom: 25px;
  font-weight: 800;
}

#hsm-page .community p {
  color: #c1c8db;
  font-size: 25px;
  line-height: 2;
}

#hsm-page .disclaimer {
  color: #8995ad;
  font-size: 18px;
  line-height: 2;
  text-align: center;
  max-width: 950px;
  margin: 45px auto;
  padding: 0 25px;
}

#hsm-page .sticky-cta {
  position: fixed;
  z-index: 99999;
  bottom: 15px;
  left: 3%;
  width: 94%;
  max-width: 1000px;
  margin: auto;
  border-radius: 60px;
  padding: 25px 18px;
  font-size: 28px;
  background: linear-gradient(100deg,#8131e9,#078fdc);
  border: 1px solid #a55aff;
  color: white;
  text-decoration: none;
  text-align: center;
  font-weight: 800;
  box-shadow: 0 8px 30px #0008;
}

@media(max-width:600px) {
  #hsm-page .hero {
    padding: 35px 18px 55px;
  }

  #hsm-page .topbar {
    padding-bottom: 60px;
    gap: 8px;
  }

  #hsm-page .brand {
    font-size: 23px;
  }

  #hsm-page .tagline {
    font-size: 11px;
    letter-spacing: 1px;
    padding: 12px 10px;
  }

  #hsm-page .profile {
    width: 290px;
    height: 290px;
  }

  #hsm-page .welcome {
    font-size: 18px;
    letter-spacing: 3px;
  }

  #hsm-page h1 {
    font-size: 40px;
  }

  #hsm-page .urdu {
    font-size: 26px;
  }

  #hsm-page .intro {
    font-size: 21px;
  }

  #hsm-page .telegram {
    font-size: 23px;
    padding: 28px 15px;
    border-radius: 26px;
  }

  #hsm-page .telegram small {
    font-size: 17px;
  }

  #hsm-page .section {
    padding: 55px 22px;
  }

  #hsm-page .section h2,
  #hsm-page .community h2 {
    font-size: 38px;
  }

  #hsm-page .section-subtitle {
    font-size: 21px;
  }

  #hsm-page .learning-card {
    padding: 32px 25px;
    border-radius: 30px;
  }

  #hsm-page .learning-card .emoji {
    font-size: 48px;
  }

  #hsm-page .learning-card h3 {
    font-size: 27px;
  }

  #hsm-page .learning-card p {
    font-size: 21px;
  }

  #hsm-page .quote {
    font-size: 25px;
    padding: 35px 20px;
  }

  #hsm-page .community p {
    font-size: 21px;
  }

  #hsm-page .disclaimer {
    font-size: 16px;
  }

  #hsm-page .sticky-cta {
    font-size: 22px;
    padding: 22px 12px;
  }
}
</style>
